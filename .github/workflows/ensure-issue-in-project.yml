name: Auto-add issue to required project (reusable)

on:
  workflow_call:
    inputs:
      required_project:
        description: "Required project as owner/number (e.g. recoverag/6) or ProjectV2 node ID"
        required: true
        type: string

permissions:
  contents: read
  repository-projects: write

jobs:
  auto-add-issue-to-project:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Ensure issue is in required project
        uses: actions/github-script@v7
        env:
          REQUIRED_PROJECT: ${{ inputs.required_project }}
        with:
          github-token: ${{ github.token }}
          script: |
            const requiredProject = (process.env.REQUIRED_PROJECT || "").trim();
            if (!requiredProject) {
              core.setFailed("Missing required project.");
              return;
            }

            let requiredProjectId = requiredProject;
            if (!requiredProject.startsWith("PVT_")) {
              const match = requiredProject.match(/^([^/]+)\/(\d+)$/);
              if (!match) {
                core.setFailed("required_project must be owner/number (e.g. recoverag/6) or a ProjectV2 node ID.");
                return;
              }

              const owner = match[1];
              const number = Number(match[2]);

              async function resolveOrgProjectId(login, num) {
                try {
                  const data = await github.graphql(
                    `
                    query($owner: String!, $number: Int!) {
                      organization(login: $owner) {
                        projectV2(number: $number) {
                          id
                        }
                      }
                    }
                    `,
                    { owner: login, number: num }
                  );
                  return data?.organization?.projectV2?.id || null;
                } catch {
                  return null;
                }
              }

              async function resolveUserProjectId(login, num) {
                try {
                  const data = await github.graphql(
                    `
                    query($owner: String!, $number: Int!) {
                      user(login: $owner) {
                        projectV2(number: $number) {
                          id
                        }
                      }
                    }
                    `,
                    { owner: login, number: num }
                  );
                  return data?.user?.projectV2?.id || null;
                } catch {
                  return null;
                }
              }

              const repoOwnerType = context.payload.repository?.owner?.type;
              if (repoOwnerType === "Organization") {
                requiredProjectId = await resolveOrgProjectId(owner, number);
                if (!requiredProjectId) {
                  requiredProjectId = await resolveUserProjectId(owner, number);
                }
              } else {
                requiredProjectId = await resolveUserProjectId(owner, number);
                if (!requiredProjectId) {
                  requiredProjectId = await resolveOrgProjectId(owner, number);
                }
              }

              if (!requiredProjectId) {
                core.setFailed(`Project not found or not accessible: ${requiredProject}`);
                return;
              }
            }

            const issueNodeId = context.payload.issue?.node_id;
            if (!issueNodeId) {
              core.setFailed("No issue node_id found in event payload.");
              return;
            }

            const data = await github.graphql(
              `
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 100) {
                      nodes {
                        project {
                          ... on ProjectV2 {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
              `,
              { issueId: issueNodeId }
            );

            const projectIds = (data?.node?.projectItems?.nodes || [])
              .map((n) => n?.project?.id)
              .filter(Boolean);

            if (projectIds.includes(requiredProjectId)) {
              return;
            }

            await github.graphql(
              `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item {
                    id
                  }
                }
              }
              `,
              {
                projectId: requiredProjectId,
                contentId: issueNodeId,
              }
            );

name: Close linked issues on target branches (reusable)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  close-linked-issues:
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close linked issues
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed("No pull request payload found.");
              return;
            }

            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 100) {
                      nodes {
                        number
                        state
                        repository {
                          nameWithOwner
                        }
                      }
                    }
                  }
                }
              }
            `;

            const data = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: pr.number,
            });

            const issues = data?.repository?.pullRequest?.closingIssuesReferences?.nodes || [];
            core.info(`Found ${issues.length} linked issue(s) for PR #${pr.number}.`);

            let closedCount = 0;

            for (const issue of issues) {
              if (issue.state === "CLOSED") {
                continue;
              }

              const [owner, repo] = issue.repository.nameWithOwner.split("/");

              try {
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number: issue.number,
                  state: "closed",
                });

                closedCount += 1;
                core.info(`Closed ${owner}/${repo}#${issue.number}`);
              } catch (error) {
                core.warning(`Could not close ${owner}/${repo}#${issue.number}: ${error.message}`);
              }
            }

            core.notice(`Finished. Closed ${closedCount} issue(s) linked to PR #${pr.number}.`);
            if (closedCount < issues.length) {
              core.notice("Some linked issues may already be closed or inaccessible with this token.");
            }

            if (issues.length === 0) {
              core.notice("No linked issues to close.");
            }
